<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0f1d; border-radius: 12px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1933" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#326ce5" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pulseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" />
    </filter>
  </defs>

  <style>
    .grid-bg { opacity: 0.8; }
    .node-pulse {
      animation: pulse 3s infinite ease-in-out;
    }
    .orbit-pulse {
      animation: orbitGlow 6s infinite alternate ease-in-out;
    }
    .stream-fast {
      stroke-dasharray: 8 16;
      animation: dash 20s linear infinite;
    }
    .stream-slow {
      stroke-dasharray: 12 24;
      animation: dashRev 25s linear infinite;
    }
    .pill-float-1 { animation: float1 4s ease-in-out infinite alternate; }
    .pill-float-2 { animation: float2 5s ease-in-out infinite alternate; }
    .pill-float-3 { animation: float1 4.5s ease-in-out infinite alternate 1s; }
    .pill-float-4 { animation: float2 5.5s ease-in-out infinite alternate 1.5s; }

    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes dashRev {
      to { stroke-dashoffset: 1000; }
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.4; }
      50% { r: 7px; opacity: 0.9; }
      100% { r: 4px; opacity: 0.4; }
    }
    @keyframes orbitGlow {
      0% { opacity: 0.3; transform: scale(0.98); transform-origin: center; }
      100% { opacity: 0.7; transform: scale(1.02); transform-origin: center; }
    }
    @keyframes float1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-7px); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(6px); }
    }
  </style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" class="grid-bg" />

  <!-- Dynamic Ambient Glowing Orbs in Background (Stay behind text) -->
  <circle cx="200" cy="180" r="140" fill="#326ce5" opacity="0.15" filter="url(#pulseGlow)" class="orbit-pulse" />
  <circle cx="1000" cy="180" r="150" fill="#8b5cf6" opacity="0.15" filter="url(#pulseGlow)" class="orbit-pulse" />
  <circle cx="600" cy="90" r="110" fill="#06b6d4" opacity="0.12" filter="url(#pulseGlow)" />

  <!-- Animated Neural / Distributed Mesh Streams (Behind Content) -->
  <g opacity="0.45">
    <path d="M-100 280 C 200 320, 400 120, 700 240 C 900 320, 1100 180, 1300 220" fill="none" stroke="url(#glowGrad)" stroke-width="2" class="stream-fast" />
    <path d="M-50 100 C 250 40, 500 260, 850 140 C 1050 60, 1150 240, 1300 120" fill="none" stroke="#3b82f6" stroke-width="1.5" class="stream-slow" />
    <path d="M100 360 C 350 200, 650 300, 950 160 C 1100 90, 1200 200, 1300 180" fill="none" stroke="#a855f7" stroke-width="1.2" class="stream-fast" />
  </g>

  <!-- Floating Distributed Nodes with Pulse -->
  <g fill="#38bdf8">
    <circle cx="140" cy="90" class="node-pulse" />
    <circle cx="240" cy="270" class="node-pulse" style="animation-delay: 0.7s;" />
    <circle cx="980" cy="80" class="node-pulse" style="animation-delay: 1.2s;" fill="#c084fc" />
    <circle cx="1080" cy="280" class="node-pulse" style="animation-delay: 1.8s;" fill="#34d399" />
    <circle cx="60" cy="200" class="node-pulse" style="animation-delay: 2.2s;" />
    <circle cx="1140" cy="170" class="node-pulse" style="animation-delay: 0.4s;" fill="#60a5fa" />
  </g>

  <!-- Foreground Content: Top Micro Badge -->
  <g transform="translate(480, 42)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <text x="30" y="18" fill="#93c5fd" font-size="12" font-weight="600" letter-spacing="1">CLOUD-NATIVE AI &amp; GPUS</text>
  </g>

  <!-- Main Hero Titles (Firm Foreground, Crisp Typography) -->
  <text x="600" y="125" text-anchor="middle" fill="url(#textGrad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Distributed AI</text>
  <text x="600" y="168" text-anchor="middle" fill="#f8fafc" font-size="32" font-weight="700" letter-spacing="1">ON KUBERNETES ☸️ 🚀</text>

  <!-- Subtitle Description -->
  <text x="600" y="206" text-anchor="middle" fill="#94a3b8" font-size="15" font-weight="400">
    Curated SaaS Platforms, Gang Schedulers, Distributed Training Operators &amp; High-Throughput Inference
  </text>

  <!-- Interactive Dynamic Pill Badges in Foreground -->
  <g transform="translate(600, 265)">
    <!-- Pill 1: GPU Scheduling -->
    <g transform="translate(-390, 0)" class="pill-float-1">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">⚡ GPU Gang Scheduling</text>
    </g>

    <!-- Pill 2: Distributed Training -->
    <g transform="translate(-195, 0)" class="pill-float-2">
      <rect x="0" y="0" width="185" height="38" rx="19" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="92" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">🏋️ Distributed Training</text>
    </g>

    <!-- Pill 3: LLM Inference -->
    <g transform="translate(10, 0)" class="pill-float-3">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">🔥 vLLM &amp; KServe Serving</text>
    </g>

    <!-- Pill 4: Cloud Managed -->
    <g transform="translate(205, 0)" class="pill-float-4">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <text x="90" y="24" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">☁️ GKE • EKS • AKS • ROSA</text>
    </g>
  </g>

  <!-- Bottom Accent Border Glow -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#glowGrad)" />
</svg>
